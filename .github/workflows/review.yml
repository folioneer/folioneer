name: Review

# The reviewers of `app@daneel`, checked out at the pinned tag (DANEEL_REF), run on
# every pull request, one job per lane the diff touches (the plugin's
# review-lanes.sh, with the base branch's .claude/daneel.json). A lane reviews a
# pull request once (daneel's loop.md § 5): its report is a lane comment and fails
# the check on any 🔴 critical; on a later push the job passes once every 🔴 and 🟡
# is graded in a newer comment. The `adr` and `guides` lanes run locally only
# (docs/workflow.md § The loop here). Runs on the owner's Claude subscription through the
# CLAUDE_CODE_OAUTH_TOKEN repository secret (minted with `claude setup-token`),
# never on API billing; the check fails closed without it rather than
# reporting a review that did not happen.

on:
  pull_request:
    branches: [main]
  # Re-run by hand on an open pull request when GitHub drops the event
  # (`gh workflow run Review --ref <branch> -f pr=<number>`).
  workflow_dispatch:
    inputs:
      pr:
        description: "Pull request number to review"
        required: true

concurrency:
  group: review-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # The daneel release the reviewers, their protocol and helpers come from. A pull
  # request moves it; the prompts of that pull request's own review are then the new ones.
  DANEEL_REF: app--v0.11.3

jobs:
  lanes:
    name: Lanes touched by the diff
    runs-on: ubuntu-latest
    timeout-minutes: 3
    outputs:
      lanes: ${{ steps.detect.outputs.lanes }}
    steps:
      # Every pin below was verified against its tag with `git ls-remote --tags`
      # on 2026-09-13 (reviewer-infra FP: the tags are newer than the
      # reviewer's training data, not wrong).
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
        with:
          repository: phileggel/daneel
          ref: ${{ env.DANEEL_REF }}
          path: .daneel
          persist-credentials: false
      - name: Map changed files to reviewer lanes
        # The lane map is the pinned release's and its settings the base branch's, so a
        # pull request cannot switch its own reviewers off. A base branch without the
        # settings (the pull request that adds them) runs the plugin's defaults.
        id: detect
        shell: bash
        env:
          BASE: ${{ github.base_ref || 'main' }}
        run: |
          set -euo pipefail
          rm -f .claude/daneel.json
          if git cat-file -e "origin/$BASE:.claude/daneel.json" 2>/dev/null; then
            git show "origin/$BASE:.claude/daneel.json" > .claude/daneel.json
          fi
          lanes=$(git diff --name-only "origin/$BASE...HEAD" | bash .daneel/plugins/app/scripts/review-lanes.sh --json)
          echo "lanes=$lanes" >> "$GITHUB_OUTPUT"
          echo "$lanes"

  review:
    name: reviewer-${{ matrix.reviewer }}
    needs: lanes
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
      # The report is a lane comment on the pull request; the lanes job
      # only reads the diff.
      pull-requests: write
    env:
      # Where the pinned action writes the session's execution log (verified
      # against v1 @ 9cdae7f; re-check when the pin moves).
      SESSION_LOG: /home/runner/work/_temp/claude-execution-output.json
    strategy:
      fail-fast: false
      matrix:
        reviewer: [backend, arch, frontend, sql, infra, security, e2e, spec, contract]
    steps:
      - name: Skip lanes the diff does not touch
        id: gate
        shell: bash
        env:
          LANES: ${{ needs.lanes.outputs.lanes }}
          REVIEWER: ${{ matrix.reviewer }}
        run: |
          set -euo pipefail
          # The agent file behind the lane, and what it is pointed at: the code
          # reviewers read the diff, the two document reviewers the changed documents.
          case "$REVIEWER" in
            spec) echo "agent=spec-reviewer" >> "$GITHUB_OUTPUT"
                  echo "target=on each file under docs/spec/ that the pull request changed, one after the other, in its changed-lines mode (what the pull request did not change is listed without a severity)" >> "$GITHUB_OUTPUT" ;;
            contract) echo "agent=contract-reviewer" >> "$GITHUB_OUTPUT"
                  echo "target=on each file under docs/contracts/ that the pull request changed, one after the other, against its spec, in its changed-lines mode (what the pull request did not change is listed without a severity)" >> "$GITHUB_OUTPUT" ;;
            *) echo "agent=reviewer-$REVIEWER" >> "$GITHUB_OUTPUT"
               echo "target=in its default changed-lines mode" >> "$GITHUB_OUTPUT" ;;
          esac
          if [[ "$(jq -r --arg r "$REVIEWER" '.[$r]' <<<"$LANES")" == "true" ]]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "reviewer-$REVIEWER: no file in its lane changed"
          fi

      - name: Require the subscription token
        if: steps.gate.outputs.run == 'true'
        shell: bash
        env:
          TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: |
          if [[ -z "$TOKEN" ]]; then
            echo "::error::CLAUDE_CODE_OAUTH_TOKEN is not set on the repository (mint one with \`claude setup-token\`, store it with \`gh secret set CLAUDE_CODE_OAUTH_TOKEN\`) — the reviewer cannot run, and a review that did not happen must not pass."
            exit 1
          fi

      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
        if: steps.gate.outputs.run == 'true'
        with:
          fetch-depth: 0
          # The session gets a broad shell over the pull request's content.
          persist-credentials: false

      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
        if: steps.gate.outputs.run == 'true'
        with:
          repository: phileggel/daneel
          ref: ${{ env.DANEEL_REF }}
          path: .daneel
          persist-credentials: false

      - name: Review a pull request once
        # In CI a lane reviews a pull request once (daneel's loop.md § 5, the plugin's
        # README § One review per PR). On a later push it starts no session: it passes
        # when every 🔴 and 🟡 of its report has a grade in a newer comment, and fails
        # while one has none. A lane with no report yet (new to the pull request, or
        # stopped by the usage limit) reviews. The tests validate a fix.
        id: once
        if: steps.gate.outputs.run == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number || github.event.inputs.pr }}
          REVIEWER: ${{ matrix.reviewer }}
        run: |
          set -euo pipefail
          code=0
          python3 .daneel/plugins/app/scripts/lane-reviewed.py "$PR_NUMBER" "$REVIEWER" || code=$?
          case "$code" in
            3) echo "review=true" >> "$GITHUB_OUTPUT" ;;
            0) echo "review=false" >> "$GITHUB_OUTPUT" ;;
            *) exit 1 ;;
          esac

      - name: Give the branch helper a local main, the base branch's settings, and the branch's tree
        # The plugin's branch.sh resolves the diff base as merge-base(HEAD, main) and
        # lists untracked files: `.daneel/` is kept out of what it reports. The prompts
        # and helpers come from the pinned release and their settings from the base
        # branch, so a pull request can neither soften the criteria that grade it nor
        # change what the reviewer runs; one that edits them still has that edit in its
        # diff. The branch's tree as pushed is a worktree the session reads.
        id: trusted
        if: steps.gate.outputs.run == 'true' && steps.once.outputs.review == 'true'
        shell: bash
        env:
          BASE: ${{ github.base_ref || 'main' }}
        run: |
          set -euo pipefail
          git branch -f main "origin/$BASE"
          echo ".daneel/" >> .git/info/exclude
          git worktree add --detach /home/runner/work/_temp/branch HEAD
          # The report's folder exists before the session starts, so its first write
          # needs no directory the session would have to create.
          mkdir -p .review
          # The branch's own skills and agents never load into the session: its diff
          # still shows them (`branch.sh diff`, `git show HEAD:<path>`).
          rm -rf /home/runner/work/_temp/branch/.claude/skills /home/runner/work/_temp/branch/.claude/agents
          for path in CLAUDE.md .claude/settings.json .claude/daneel.json .claude/agents .claude/skills .claude/rules; do
            rm -rf "$path"
            if git cat-file -e "origin/$BASE:$path" 2>/dev/null; then
              git checkout "origin/$BASE" -- "$path"
            fi
          done
          git status --short CLAUDE.md .claude

      - name: Run the reviewer prompt
        # The session is granted the commands the reviewers run, by name, and
        # nothing else: a command nobody listed is refused, the lane says so
        # in its session log, and the list grows on purpose (DEBT-082). The
        # names come from the session logs of the lanes — the two helpers,
        # the reading commands of git, and the text tools they pipe into.
        # None runs code the pull request brings: the two helpers come from
        # the pinned release in `.daneel/`, and no interpreter, test runner or
        # build tool is granted — once one starts, this list constrains nothing.
        # One reaches out of the runner, and only to read the tags of an action
        # on github.com: the infra lane judges a pin against them. The shell can
        # still read anything in the checkout; the report and the session log
        # are redacted below before they leave. The workflow step below owns
        # the PR comment.
        # (`--allowedTools` takes space- or comma-separated `Tool(pattern)`
        # entries; `Bash(git diff *)` is the CLI's own documented shape.)
        if: steps.gate.outputs.run == 'true' && steps.trusted.outcome == 'success'
        uses: anthropics/claude-code-action@9cdae7f0d995e3ba7c33f226087fdf82a59cd520  # v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # The workflow token is enough: the session gets no GitHub tool, so
          # the action only needs it to read the pull request. Without it the
          # action mints one through OIDC, which needs the Claude GitHub App.
          github_token: ${{ secrets.GITHUB_TOKEN }}
          prompt: |
            You are the `${{ steps.gate.outputs.agent }}` reviewer of this repository.
            Read `.daneel/plugins/app/agents/${{ steps.gate.outputs.agent }}.md` and follow it
            exactly, ${{ steps.gate.outputs.target }}, against the current branch
            (the pull request's merge commit; `bash .daneel/plugins/app/scripts/branch.sh
            files` and `bash .daneel/plugins/app/scripts/branch.sh diff <path> [<path> ...]`
            give the changed set and the whole diff in one call).
            `${CLAUDE_PLUGIN_ROOT}` in it is `.daneel/plugins/app`, relative to the working
            directory: run the helpers exactly as `bash .daneel/plugins/app/scripts/<helper> …`.
            The working directory's `CLAUDE.md` and `.claude/` are the base branch's,
            `.daneel/` is the pinned release: your instructions, not what you review.
            Read, grep and glob the pull request's files, and the documents you check
            them against, in `/home/runner/work/_temp/branch/`: the branch's tree as
            pushed, the same paths; where a prompt says `git show HEAD:<path>`, read the
            file there. Nobody answers a question here.
            Include `docs/ubiquitous-language.md` in your term checks. Save the
            full report with the Write tool at the path printed by `bash
            .daneel/plugins/app/scripts/review-path.sh reviewer-${{ matrix.reviewer }}`,
            whatever the agent file says about where its output goes, and begin it with one
            headline: `🔴 N critical, 🟡 N warning(s), 🔵 N suggestion(s)`, or
            `✅ No issues found.` when there is none. Do not post comments or reviews
            on GitHub yourself; the workflow does that from the saved file.
            Be concise: one line per finding (location, claim, fix); no
            restating of the diff, no narrative, no unrequested alternatives.
          claude_args: |
            --model claude-sonnet-5
            --max-turns 80
            --add-dir /home/runner/work/_temp/branch
            --allowedTools "Read" "Grep" "Glob" "Write(.review/**)" "Edit(.review/**)" "Write(/${{ github.workspace }}/.review/**)" "Edit(/${{ github.workspace }}/.review/**)" "Bash(bash .daneel/plugins/app/scripts/branch.sh *)" "Bash(bash .daneel/plugins/app/scripts/review-path.sh *)" "Bash(bash ${{ github.workspace }}/.daneel/plugins/app/scripts/branch.sh *)" "Bash(bash ${{ github.workspace }}/.daneel/plugins/app/scripts/review-path.sh *)" "Bash(git diff *)" "Bash(git log *)" "Bash(git show *)" "Bash(git status *)" "Bash(git rev-parse *)" "Bash(git merge-base *)" "Bash(git cat-file *)" "Bash(git ls-remote --tags https://github.com/*)" "Bash(grep *)" "Bash(head *)" "Bash(tail *)" "Bash(cat *)" "Bash(ls *)" "Bash(wc *)" "Bash(sort *)" "Bash(uniq *)" "Bash(cut *)" "Bash(tr *)" "Bash(sed -n *)" "Bash(echo *)" "Bash(test *)" "Bash(shellcheck *)"

      - name: Redact secret-shaped strings from what leaves the runner
        # The session's shell inherits the job environment; a prompt injection
        # in a reviewed diff could steer it into echoing a token into the
        # report. The report becomes a public comment and the log an artifact,
        # so both are scrubbed of token shapes first.
        if: ${{ steps.gate.outputs.run == 'true' && steps.once.outputs.review == 'true' && !cancelled() }}
        shell: bash
        run: |
          set -euo pipefail
          scrub() { sed -E 's/sk-ant-[A-Za-z0-9_-]{8,}/[redacted-token]/g; s/gh[pousr]_[A-Za-z0-9]{20,}/[redacted-token]/g; s/(ANTHROPIC_API_KEY|CLAUDE_CODE_OAUTH_TOKEN|GITHUB_TOKEN|GH_TOKEN)=[^ "]+/\1=[redacted]/g'; }
          for f in .review/reviewer-*.md; do [[ -e "$f" ]] && { scrub < "$f" > "$f.tmp" && mv "$f.tmp" "$f"; }; done
          if [[ -f "$SESSION_LOG" ]]; then scrub < "$SESSION_LOG" > review-session.json; fi
          echo "redaction pass done"

      - name: Keep the session log for diagnosis
        # Every turn, tool call and denial of the review session; the only
        # way to see why a lane produced no report.
        if: ${{ steps.gate.outputs.run == 'true' && steps.once.outputs.review == 'true' && !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: review-session-${{ matrix.reviewer }}
          path: review-session.json
          if-no-files-found: ignore
          retention-days: 7

      - name: Post the report and fail on criticals
        # Runs even when the reviewer step failed, so a failed round still leaves
        # its report beside the red check.
        if: ${{ steps.gate.outputs.run == 'true' && steps.once.outputs.review == 'true' && !cancelled() }}
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number || github.event.inputs.pr }}
          REVIEWER: ${{ matrix.reviewer }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          BASE: ${{ github.base_ref || 'main' }}
        run: |
          set -euo pipefail
          report=$(ls -t .review/reviewer-"$REVIEWER"-*.md 2>/dev/null | head -n 1 || true)
          MARKER="<!-- review:$REVIEWER -->"
          if [[ -z "$report" ]]; then
            # The session's last message says why (a usage limit, a refusal, a
            # tool problem); surface it instead of a bare "no report".
            last=$(jq -r 'if type=="array" then .[] else . end | select(.type=="result") | .result // empty' \
              review-session.json 2>/dev/null | tail -c 1500 || true)
            # A session stopped by the subscription's usage limit reviewed nothing:
            # say "did not run", not "no report", so the red check is not read as
            # a finding (FLOW-002). It still fails — an unreviewed
            # pull request does not merge — and is re-run once the limit resets.
            if grep -qiE "hit your (session|usage|weekly) limit|usage limit reached" <<<"$last"; then
              heading="did not run (usage limit)"
              advice="The reviewer's session was stopped by the usage limit before it read anything. Re-run the failed jobs once the limit has reset: \`gh run rerun ${GITHUB_RUN_ID} --failed\`."
            else
              heading="no report"
              advice="The reviewer produced no report; the check fails until it does."
            fi
            # Why the session stopped, in one line of named fields (its turn limit
            # leaves no final message). The script is read from the base branch and
            # run from outside the checkout: this step holds a token, and a pull
            # request must not choose what runs beside it (FLOW-026).
            stopped="the stop reason could not be read"
            if git show "origin/$BASE:scripts/review-stop-reason.py" > "$RUNNER_TEMP/review-stop-reason.py" 2>/dev/null; then
              stopped=$(python3 "$RUNNER_TEMP/review-stop-reason.py" review-session.json || echo "$stopped")
            fi
            echo "reviewer-$REVIEWER wrote no report: $stopped"
            body=$(printf '%s\n## reviewer-%s — %s\n\n%s ([run](%s))\n\nWhy it stopped: %s.\n\nSession said:\n\n> %s\n' \
              "$MARKER" "$REVIEWER" "$heading" "$advice" "$RUN_URL" "$stopped" "${last:-(no final message)}")
            criticals=1
          else
            # verdict:begin — kept inline: a file in the checkout could be rewritten
            # by the session whose report it judges. scripts/tests/test_review_verdict.py
            # runs these lines on real headlines.
            # The count of criticals is read whatever sign precedes it ("🔵 0 critical"
            # is clean). A reviewer that found none may leave the count out: the
            # report is then clean when it carries no 🔴 and at least one of the
            # signs a report is written with — a 🔴 counts where a finding starts (a line, a
            # heading, a bullet), not in a sentence about one —, or is the protocol's "review skipped" reply
            # for a lane with no file in the diff. Anything else cannot be read, and
            # fails the check as a missing report does.
            criticals=$( { grep -Eo '[0-9]+ critical' "$report" || true; } | grep -Eo '[0-9]+' | head -n 1 || true)
            if [[ -z "$criticals" ]]; then
              if grep -qE '^(#+ +|- +)?🔴' "$report"; then criticals=1
              elif grep -qE '✅|🟡|🔵' "$report"; then criticals=0
              elif grep -qE '^ℹ️ No .+ files modified — review skipped\.' "$report"; then criticals=0
              else criticals=1
              fi
            fi
            # verdict:end
            # GitHub caps a comment at 65 536 characters; keep the head of a long report.
            body=$(printf '%s\n%s\n\n[run](%s)\n' "$MARKER" "$(head -c 60000 "$report")" "$RUN_URL")
          fi
          # One comment per round, never an edit of the last: the grades that follow a
          # report are read against it (lane-reviewed.py, merge.py).
          gh pr comment "$PR_NUMBER" --body "$body"
          if [[ "$criticals" != "0" ]]; then
            echo "::error::reviewer-$REVIEWER reported $criticals critical finding(s) — see the PR comment."
            exit 1
          fi
          echo "reviewer-$REVIEWER: no critical"
