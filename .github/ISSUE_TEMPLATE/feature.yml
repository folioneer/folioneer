name: Feature
description: Something a user will see that does not exist yet
labels: ["feature"]
projects: ["folioneer/1"]
body:
  - type: markdown
    attributes:
      value: The title is one plain sentence stating what is seen — no kind prefix, no id.
  - type: dropdown
    id: size
    attributes:
      label: Size
      description: "By facts, not effort. S: one pull request, one layer, nothing from the owner. M: any other single pull request. L: two or three pull requests, or mocks or a spec interview. XL: a programme, sliced before it is queued."
      options: [S, M, L, XL]
    validations:
      required: true
  - type: textarea
    id: user-value
    attributes:
      label: User value
      description: What the user notices once it ships, in one or two sentences.
      placeholder: The journal forgets its filter on reload
    validations:
      required: true
  - type: textarea
    id: done-when
    attributes:
      label: Done when
      description: The checkable clauses that close this issue; each becomes a test or a screenshot.
    validations:
      required: true
  - type: textarea
    id: design
    attributes:
      label: Design
      description: "none, needed (mocks come first), or validated. Mocks are images attached here, invented data only."
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: Personal data
      options:
        - label: "This issue holds no real portfolio data: no account, holding or amount from a real record; screenshots and mocks show invented data only."
          required: true
