name: Task
description: Something a user will not see — a refactor, a chore, an enabler for a feature, a gap a reviewer found
labels: ["task"]
projects: ["folioneer/1"]
body:
  - type: markdown
    attributes:
      value: The title is one plain sentence stating the observation — no kind prefix, no id.
  - type: input
    id: found-by
    attributes:
      label: Found by
      description: The reviewer, check or pull request that surfaced it.
    validations:
      required: true
  - type: textarea
    id: where
    attributes:
      label: Where
      description: Paths from the repository root.
    validations:
      required: true
  - type: textarea
    id: observation
    attributes:
      label: Observation
      description: One observation, with its evidence (a figure, a pull request), and its gate if any ("when next touched").
    validations:
      required: true
  - type: dropdown
    id: size
    attributes:
      label: Size
      description: "By facts, not effort. S: one pull request, one layer, nothing from the owner. M: any other single pull request. L: two or three pull requests, or mocks or a spec interview. XL: a programme, sliced before it is queued."
      options: [S, M, L, XL]
    validations:
      required: true
  - type: input
    id: waits-on-owner
    attributes:
      label: Waits on the owner
      description: "no, or for what (then add the needs-owner label)."
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: Personal data
      options:
        - label: "This issue holds no real portfolio data: no account, holding or amount from a real record; screenshots and mocks show invented data only."
          required: true
